name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      # Caches Gradle and validates the committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
